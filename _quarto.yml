lang: fr

project:
  type: book
  output-dir: _book

book:
  title: "R pour la Science de Données (2e)"
  reader-mode: true
  description: |
    *Traducation française du livre "R pour la Science de Données (2e)" de Hadley Wickham, Mine
    Çetinkaya-Rundel, et Garrett Grolemund.*

  page-footer:
    left: |
      R pour la Science de Données (2e) a été écrit par Hadley Wickham, Mine
      Çetinkaya-Rundel, et Garrett Grolemund. Traduction française d'après
      l'<a href="https://github.com/hadley/r4ds/">ouvrage original</a>.
    right: |
      Ce livre a été construit avec <a href="https://quarto.org/">Quarto</a>.
  cover-image: cover.jpg
  favicon: cover.jpg

  site-url: https://dianethy.github.io/r4ds-fr/
  repo-url: https://github.com/DianeThy/r4ds-fr/
  repo-branch: main
  repo-actions: [edit, issue]

  chapters:
    - index.qmd

    - preface-2e.qmd
    - intro.qmd

    - part: whole-game.qmd
      chapters:
        - data-visualize.qmd
        - workflow-basics.qmd
        - data-transform.qmd
        - workflow-style.qmd
        - data-tidy.qmd
        - workflow-scripts.qmd
        - data-import.qmd
        - workflow-help.qmd

    - part: visualize.qmd
      chapters:
        - layers.qmd
        - EDA.qmd
        - communication.qmd

    - part: transform.qmd
      chapters:
        - logicals.qmd
        - numbers.qmd
        - strings.qmd
        - regexps.qmd
        - factors.qmd
        - datetimes.qmd
        - missing-values.qmd
        - joins.qmd

    - part: import.qmd
      chapters:
        - spreadsheets.qmd
        - databases.qmd
        - arrow.qmd
        - rectangling.qmd
        - webscraping.qmd

    - part: program.qmd
      chapters:
        - functions.qmd
        - iteration.qmd
        - base-R.qmd

    - part: communicate.qmd
      chapters:
        - quarto.qmd
        - quarto-formats.qmd

format:
  html:
    theme:
      - cosmo
      - r4ds.scss
    code-link: true

    author-meta: "Hadley Wickham, Mine Çetinkaya-Rundel, et Garrett Grolemund"
    include-in-header: "plausible.html"
    callout-appearance: simple

editor: source
